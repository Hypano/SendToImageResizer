name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate project and bundled runtime
        shell: powershell
        run: .\Test-Project.ps1 -RequireImageMagick

      - name: Run end-to-end image test
        shell: powershell
        run: .\Test-Integration.ps1
